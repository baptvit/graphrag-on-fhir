[project]
name = "graphrag-on-fhir"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.43.0",
    "deepeval>=2.1.6",
    "google-generativeai>=0.8.3",
    "instructor>=1.6.2",
    "ipdb>=0.13.13",
    "jupyter>=1.1.1",
    "lab>=8.3",
    "langchain>=0.3.14",
    "langchain-community>=0.3.14",
    "langchain-google-vertexai>=2.0.11",
    "langchain-openai>=0.2.2",
    "neo4j==5.25.0",
    "openai==1.47.0",
    "python-dotenv>=1.0.1",
    "ragas>=0.2.11",
    "sentence-transformers==3.1.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "tokenizers>=0.21.0",
]

[tool.ruff]
line-length = 90
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint]
extend-select = ["ERA"]
