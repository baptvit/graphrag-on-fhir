[project]
name = "graphrag-on-fhir"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.11"
dependencies = [
    "anthropic>=0.43.0",
    "deepeval>=2.1.6",
    "fastapi>=0.115.6",
    "google-cloud-aiplatform>=1.76.0",
    "google-generativeai>=0.8.3",
    "instructor>=1.6.2",
    "ipdb>=0.13.13",
    "jupyter>=1.1.1",
    "lab>=8.3",
    "langchain>=0.3.14",
    "langchain-community>=0.3.14",
    "langchain-google-genai>=2.0.8",
    "langchain-google-vertexai>=2.0.0",
    "langchain-huggingface>=0.1.2",
    "langchain-openai>=0.2.2",
    "langserve>=0.3.1",
    "neo4j==5.25.0",
    "openai==1.47.0",
    "httpx==0.27.2",
    "python-dotenv>=1.0.1",
    "ragas>=0.2.11",
    "sentence-transformers==3.1.0",
    "sse-starlette>=2.2.1",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "tokenizers>=0.21.0",
    "uvicorn>=0.34.0",
    "black>=25.1.0",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 90
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint]
extend-select = ["ERA"]
